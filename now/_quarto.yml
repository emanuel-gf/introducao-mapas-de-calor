project:
  type: website
  output-dir: docs
  render:
    - index.qmd

website:
  title: "Introduction to Heat Maps"
  navbar:
    left:
      - href: index.qmd
        text: "Guided Book"
    right:
      - icon: github
        href: https://github.com/your-username/heatmap-presentation
  page-footer:
    left: "Emanuel Goulart · 2025"
    right: "Built with Quarto"

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-fold: true
    code-tools: true
    code-copy: true
    smooth-scroll: true
    anchor-sections: true
    fig-align: center

execute:
  engine: jupyter
  echo: true
  warning: false
  message: false
  freeze: auto
